name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > keystore/release.jks
          echo "AETHER_KEYSTORE=keystore/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Rename APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" | sed -e 's/^app-/Aether-/' -e 's/-release//')
            cp "$f" "out/$name"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Aether-apk
          path: out/*.apk

      # The annotated tag message is a short English summary; the in-app updater shows it
      - name: Release notes from tag
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then git log -1 --format=%b > notes.md; fi
          cat notes.md
          # The tag message subject becomes the release title
          echo "title=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: ${{ steps.notes.outputs.title || github.ref_name }}
          body_path: notes.md
